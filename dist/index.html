    <script>
      // تثبيت الوضع الداكن دائماً - التطبيق لا يتأثر بإعدادات المتصفح
      document.documentElement.classList.add('dark');
      // Apply the saved accent color BEFORE React mounts so users never see a
      // flash of the wrong palette. App.tsx still re-applies it after auth in
      // case the value changed in the database.
      try {
        var ac = localStorage.getItem('accentColor') || 'amber';
        document.documentElement.setAttribute('data-accent-color', ac);
      } catch (e) {
        document.documentElement.setAttribute('data-accent-color', 'amber');
      }
    </script>
